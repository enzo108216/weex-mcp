name: weex-mcp

services:
  mcp:
    image: ${WEEX_MCP_IMAGE:-weex-mcp:local}
    build:
      context: .
    env_file:
      - ${WEEX_MCP_ENV_FILE:-.env}
    environment:
      WEEX_APPROVAL_TOKEN_SECRET: ${WEEX_APPROVAL_TOKEN_SECRET:?Set WEEX_APPROVAL_TOKEN_SECRET in the env file}
      WEEX_SERVICE_AUTH_TOKEN: ${WEEX_SERVICE_AUTH_TOKEN:?Set WEEX_SERVICE_AUTH_TOKEN in the env file}
      WEEX_TRADE_ENABLED: ${WEEX_TRADE_ENABLED:-false}
      WEEX_MCP_PORT: ${WEEX_MCP_PORT:-8080}
      WEEX_APPROVAL_TOKEN_TTL_SECONDS: ${WEEX_APPROVAL_TOKEN_TTL_SECONDS:-120}
      WEEX_ALLOWED_ORIGINS: ${WEEX_ALLOWED_ORIGINS:-}
      WEEX_MAX_REQUEST_BYTES: ${WEEX_MAX_REQUEST_BYTES:-1048576}
      WEEX_MARKET_TIMEOUT_SECONDS: ${WEEX_MARKET_TIMEOUT_SECONDS:-5}
      WEEX_MARKET_MAX_ATTEMPTS: ${WEEX_MARKET_MAX_ATTEMPTS:-3}
      WEEX_MARKET_RETRY_BASE_DELAY_SECONDS: ${WEEX_MARKET_RETRY_BASE_DELAY_SECONDS:-0.1}
      WEEX_ACCOUNT_TIMEOUT_SECONDS: ${WEEX_ACCOUNT_TIMEOUT_SECONDS:-5}
      WEEX_SPOT_BASE_URL: ${WEEX_SPOT_BASE_URL:-https://api-spot.weex.com}
      WEEX_FUTURES_BASE_URL: ${WEEX_FUTURES_BASE_URL:-https://api-contract.weex.com}
      WEEX_SERVER_NAME: ${WEEX_SERVER_NAME:-weex-mcp}
    ports:
      - "${WEEX_MCP_BIND_HOST:-127.0.0.1}:${WEEX_MCP_HOST_PORT:-8080}:${WEEX_MCP_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.environ.get('WEEX_MCP_PORT', '8080');
          urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=2).read()
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
