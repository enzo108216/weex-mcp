[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weex-mcp"
dynamic = ["version"]
description = "Embeddable safety-first WEEX MCP tool library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "WEEX MCP" }]
dependencies = []

[project.urls]
Documentation = "https://modelcontextprotocol.io/specification/2026-07-28"

[project.optional-dependencies]
server = [
    "uvicorn>=0.30,<1",
]
dev = [
    "build>=1.2",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "setuptools>=77",
]

[project.scripts]
weex-mcp = "weex_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "weex_mcp.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["weex_mcp"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
