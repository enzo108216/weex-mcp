name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,server]'
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests
      - name: Compile sources
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m compileall -q src
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src/weex_mcp
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Cloud server CLI
        run: weex-mcp serve --help
